<!DOCTYPE html>
<html>
<head>
<title>Friction Factor Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f0f4f8;
    padding: 30px;
}

.container {
    width: 400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px lightgray;
}

h2 {
    text-align: center;
    color: navy;
}

label {
    font-weight: bold;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 15px;
}

button {
    padding: 10px;
    margin-right: 10px;
    font-weight: bold;
}
</style>

<script>
function calculateFF() {

    let R = Number(document.getElementById("Reynolds").value);
    let D = Number(document.getElementById("Roughness").value);

    let F = 0.25 /
        Math.pow(
            Math.log10(1 / 3.7 /D + 5.74 / Math.pow(R,0.9)),
            2
        );

    document.getElementById("Result").value =
        F.toFixed(4);
}

function clearBoxes() {

    document.getElementById("Reynolds").value = "";
    document.getElementById("Roughness").value = "";
    document.getElementById("Result").value = "";
}
</script>

</head>

<body>

<div class="container">

<h2>Friction Factor Calculator</h2>

<label>Reynolds Number (e.g. 1E5)</label>
<input type="number" id="Reynolds">

<label>Relative Roughness (D/e)</label>
<input type="number" id="Roughness" step="any">

<label>Friction Factor</label>
<input type="text" id="Result" readonly>

<button onclick="calculateFF()">Calculate</button>

<button onclick="clearBoxes()">Clear</button>

</div>

</body>
</html>

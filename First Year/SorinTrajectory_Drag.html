<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SorinTrajectory with Drag</title><style>:root{--b:#1267d6;--n:#102a43;--l:#d9e2ec}*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#172b4d;font:15px system-ui}header{padding:20px 4%;color:white;background:linear-gradient(120deg,#102a43,#1479ff)}h1{margin:0}.wrap{max-width:1400px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:350px 1fr;gap:16px}.card{background:white;border:1px solid var(--l);border-radius:14px;padding:17px;box-shadow:0 4px 16px #0001}label{display:block;font-weight:650;margin:10px 0 4px}.r{display:grid;grid-template-columns:1fr 105px;gap:7px}input,select,button{width:100%;padding:8px;border:1px solid #bcccdc;border-radius:8px;font:inherit}button{font-weight:700;cursor:pointer}.blue{background:var(--b);color:white;border:0}.btns{display:grid;grid-template-columns:2fr 1fr;gap:7px;margin-top:14px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.m{padding:10px;background:#f3f8ff;border-radius:9px}.m b{display:block;font-size:18px;color:#0756b5}.m small{color:#627d98}canvas{width:100%;height:auto;border:1px solid var(--l);border-radius:10px;margin-top:10px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0}.controls button,.controls select{width:auto}.live{margin-left:auto;background:#eef7ff;padding:7px;border-radius:8px}.note{background:#fff8e7;border-left:4px solid #f59e0b;padding:9px;margin:12px 0}.table{max-height:300px;overflow:auto;border:1px solid var(--l);border-radius:9px}table{border-collapse:collapse;width:100%}th,td{padding:7px;border-bottom:1px solid #e9eef3;text-align:right}th{position:sticky;top:0;background:#eaf2fb}@media(max-width:850px){.wrap{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.live{width:100%;margin:0}}</style></head><body><header><h1>⚾ SorinTrajectory</h1><div>Animated projectile motion with optional quadratic air drag</div></header><div class="wrap"><aside class="card"><h2>Inputs</h2><label>Units</label><select id="U"><option value="SI">SI</option><option value="US">US Customary</option></select><label>Initial speed</label><div class="r"><input id="v0" type="number" value="35"><input id="vu" disabled value="m/s"></div><label>Launch angle</label><div class="r"><input id="ang" type="number" value="12"><input disabled value="degrees"></div><label>Release height</label><div class="r"><input id="h0" type="number" value="1.8"><input id="lu" disabled value="m"></div><label><input id="drag" type="checkbox" checked style="width:auto"> Include air drag</label><div id="db"><label>Ball mass</label><div class="r"><input id="mass" type="number" value="0.145" step=".001"><input id="mu" disabled value="kg"></div><label>Ball diameter</label><div class="r"><input id="dia" type="number" value="0.073" step=".001"><input id="du" disabled value="m"></div><label>Drag coefficient, Cd</label><input id="cd" type="number" value="0.47" step=".01"><label>Air density</label><div class="r"><input id="rho" type="number" value="1.225" step=".001"><input id="ru" disabled value="kg/m³"></div></div><label>Output interval, Δt</label><div class="r"><input id="dt" type="number" value="0.05" step=".01"><input disabled value="s"></div><div class="btns"><button class="blue" id="go">Calculate & Launch</button><button id="csv">CSV</button></div><div class="note">Drag is opposite the velocity. The model excludes wind, spin, lift, and seam effects.</div></aside><main class="card"><div class="metrics"><div class="m"><small>Flight time</small><b id="tf">—</b></div><div class="m"><small>Range</small><b id="R">—</b></div><div class="m"><small>Max height</small><b id="H">—</b></div><div class="m"><small>Impact speed</small><b id="Vi">—</b></div><div class="m"><small>Impact angle</small><b id="Ai">—</b></div></div><div id="compare" class="note"></div><canvas id="plot" width="1000" height="460"></canvas><div class="controls"><button class="blue" id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="restart">↺ Restart</button><select id="spd"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select><div id="live" class="live"></div></div><h2>Calculated Data</h2><div class="table"><table><thead><tr><th>t (s)</th><th id="xU">x (m)</th><th id="yU">y (m)</th><th id="vxU">Vx (m/s)</th><th id="vyU">Vy (m/s)</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script>
const $=x=>document.getElementById(x);let M,idx=0,tAnim=0,playing=false,last=0;
function calc(launch=true){let U=$('U').value,g=U==='SI'?9.81:32.174,v0=+$('v0').value,a=+$('ang').value*Math.PI/180,y0=+$('h0').value,dt=+$('dt').value,m=+$('mass').value,d=+$('dia').value,rho=+$('rho').value,Cd=+$('cd').value,use=$('drag').checked;if(U==='US'){m/=g;d/=12}if(!(v0>0&&y0>=0&&dt>0&&m>0&&d>0&&rho>=0&&Cd>=0)){alert('Please check the inputs.');return}let A=Math.PI*d*d/4,k=.5*rho*Cd*A/m,vx0=v0*Math.cos(a),vy0=v0*Math.sin(a),ti=(vy0+Math.sqrt(vy0*vy0+2*g*y0))/g,Ri=vx0*ti,Hi=y0+Math.max(vy0,0)**2/(2*g),ideal=[];for(let t=0;t<ti;t+=dt)ideal.push({t,x:vx0*t,y:Math.max(0,y0+vy0*t-.5*g*t*t)});ideal.push({t:ti,x:Ri,y:0});let data=[],tf,R,H=y0,tp=0,Vi,Ai;if(!use||Cd===0||rho===0){data=ideal.map(p=>({...p,vx:vx0,vy:vy0-g*p.t}));tf=ti;R=Ri;H=Hi;let p=data.at(-1);Vi=Math.hypot(p.vx,p.vy);Ai=Math.atan2(p.vy,p.vx)*180/Math.PI}else{let f=q=>{let v=Math.hypot(q.vx,q.vy);return{x:q.vx,y:q.vy,vx:-k*v*q.vx,vy:-g-k*v*q.vy}},step=(q,h)=>{let A=f(q),b={x:q.x+A.x*h/2,y:q.y+A.y*h/2,vx:q.vx+A.vx*h/2,vy:q.vy+A.vy*h/2},B=f(b),c={x:q.x+B.x*h/2,y:q.y+B.y*h/2,vx:q.vx+B.vx*h/2,vy:q.vy+B.vy*h/2},C=f(c),d={x:q.x+C.x*h,y:q.y+C.y*h,vx:q.vx+C.vx*h,vy:q.vy+C.vy*h},D=f(d);return{x:q.x+h*(A.x+2*B.x+2*C.x+D.x)/6,y:q.y+h*(A.y+2*B.y+2*C.y+D.y)/6,vx:q.vx+h*(A.vx+2*B.vx+2*C.vx+D.vx)/6,vy:q.vy+h*(A.vy+2*B.vy+2*C.vy+D.vy)/6}};let q={x:0,y:y0,vx:vx0,vy:vy0},t=0,next=dt,h=Math.min(.002,dt/10),prev=q,pt=0;data.push({t,...q});while(t<60&&q.y>=0){prev={...q};pt=t;q=step(q,h);t+=h;if(q.y>H){H=q.y;tp=t}if(t>=next){data.push({t,x:q.x,y:Math.max(0,q.y),vx:q.vx,vy:q.vy});next+=dt}}let z=prev.y/(prev.y-q.y),p={t:pt+z*h,x:prev.x+z*(q.x-prev.x),y:0,vx:prev.vx+z*(q.vx-prev.vx),vy:prev.vy+z*(q.vy-prev.vy)};data=data.filter(q=>q.t<p.t);data.push(p);tf=p.t;R=p.x;Vi=Math.hypot(p.vx,p.vy);Ai=Math.atan2(p.vy,p.vx)*180/Math.PI}M={U,g,data,ideal,tf,R,H,Vi,Ai,Ri,Hi,use};idx=0;tAnim=0;playing=launch;last=performance.now();show();draw()}
function show(){let u=M.U==='SI'?'m':'ft';$('tf').textContent=M.tf.toFixed(3)+' s';$('R').textContent=M.R.toFixed(2)+' '+u;$('H').textContent=M.H.toFixed(2)+' '+u;$('Vi').textContent=M.Vi.toFixed(2)+' '+u+'/s';$('Ai').textContent=M.Ai.toFixed(1)+'°';$('compare').innerHTML=M.use?`<b>Blue:</b> with drag. <b>Gray:</b> ideal. Ideal range ${M.Ri.toFixed(2)} ${u}; reduction ${(100*(1-M.R/M.Ri)).toFixed(1)}%.`:'<b>Ideal model:</b> air drag is off.';$('xU').textContent=`x (${u})`;$('yU').textContent=`y (${u})`;$('vxU').textContent=`Vx (${u}/s)`;$('vyU').textContent=`Vy (${u}/s)`;$('rows').innerHTML=M.data.map(p=>`<tr><td>${p.t.toFixed(3)}</td><td>${p.x.toFixed(3)}</td><td>${p.y.toFixed(3)}</td><td>${p.vx.toFixed(3)}</td><td>${p.vy.toFixed(3)}</td></tr>`).join('')}
function drawLine(c,pts,X,Y,color){c.strokeStyle=color;c.lineWidth=3;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(p.x),Y(p.y)):c.moveTo(X(p.x),Y(p.y)));c.stroke()}
function draw(){if(!M)return;let cv=$('plot'),c=cv.getContext('2d'),W=cv.width,H=cv.height,p={l:65,r:25,t:25,b:45},xm=Math.max(M.Ri,M.R)*1.06,ym=Math.max(M.H,M.Hi,1)*1.15,X=x=>p.l+x/xm*(W-p.l-p.r),Y=y=>p.t+(ym-y)/ym*(H-p.t-p.b);c.clearRect(0,0,W,H);c.font='13px system-ui';c.strokeStyle='#d9e2ec';c.fillStyle='#627d98';for(let i=0;i<=5;i++){let x=p.l+i*(W-p.l-p.r)/5,y=p.t+i*(H-p.t-p.b)/5;c.beginPath();c.moveTo(x,p.t);c.lineTo(x,H-p.b);c.moveTo(p.l,y);c.lineTo(W-p.r,y);c.stroke();c.textAlign='center';c.fillText((xm*i/5).toFixed(1),x,H-p.b+20);c.textAlign='right';c.fillText((ym*(1-i/5)).toFixed(1),p.l-7,y+4)}if(M.use)drawLine(c,M.ideal,X,Y,'#a8b6c5');drawLine(c,M.data,X,Y,'#1479ff');let q=M.data[Math.min(idx,M.data.length-1)];c.font='26px system-ui';c.textAlign='center';c.fillText('⚾',X(q.x),Y(q.y)+8);let u=M.U==='SI'?'m':'ft';$('live').textContent=`t=${q.t.toFixed(2)} s | x=${q.x.toFixed(2)} ${u} | y=${q.y.toFixed(2)} ${u}`}
function anim(now){if(M&&playing){tAnim=Math.min(M.tf,tAnim+(now-last)/1000*(+$('spd').value));last=now;while(idx<M.data.length-1&&M.data[idx+1].t<=tAnim)idx++;draw();if(tAnim>=M.tf)playing=false}else last=now;requestAnimationFrame(anim)}
$('go').onclick=()=>calc(true);$('play').onclick=()=>{if(idx>=M.data.length-1){idx=0;tAnim=0}playing=true;last=performance.now()};$('pause').onclick=()=>playing=false;$('restart').onclick=()=>{idx=0;tAnim=0;playing=true;last=performance.now();draw()};$('drag').onchange=()=>{$('db').style.display=$('drag').checked?'block':'none';calc(false)};$('U').onchange=()=>{let s=$('U').value==='SI';$('vu').value=s?'m/s':'ft/s';$('lu').value=s?'m':'ft';$('mu').value=s?'kg':'lbm';$('du').value=s?'m':'in';$('ru').value=s?'kg/m³':'slug/ft³';$('v0').value=s?35:115;$('h0').value=s?1.8:5.9;$('mass').value=s?.145:.32;$('dia').value=s?.073:2.87;$('rho').value=s?1.225:.002377;calc(false)};$('csv').onclick=()=>{let u=M.U==='SI'?'m':'ft',s=`t (s),x (${u}),y (${u}),Vx (${u}/s),Vy (${u}/s)\n`+M.data.map(p=>[p.t,p.x,p.y,p.vx,p.vy].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s]));a.download='SorinTrajectory_Drag_Data.csv';a.click()};calc(false);requestAnimationFrame(anim);
</script></body></html>
